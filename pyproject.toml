[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapepilot-sim"
version = "0.1.0.dev0"
description = "Simulador visual de mecanismos de transporte de fita"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Guto Leão" }]
dependencies = [
  "pyqtgraph>=0.13",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.urls]
Repository = "https://github.com/gut0leao/tapepilot-sim"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
